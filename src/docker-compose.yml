services:
  postgres:
    image: postgres:16-alpine
    container_name: tradepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradepilot_admin
      POSTGRES_PASSWORD: tradepilot_admin_dev_password
      POSTGRES_DB: tradepilot_db
    ports:
      - "5432:5432"
    volumes:
      - tradepilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradepilot_admin -d tradepilot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tradepilot_pgdata:
